name: Build

on:
  push:
    branches: [nightly]
    paths-ignore: [docs/**]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download HarmonyOS CLI
        run: |
          curl -L -o ohos_cli.zip \
            "https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/0d/v3/s85Ain1uQrWv2NwXJq0Iqg/commandline-tools-linux-x64-26.0.0.461.zip?HW-CC-KV=V1&HW-CC-Date=20260626T004742Z&HW-CC-Expire=315360000&HW-CC-Sign=6A4020EB4E3D0EADB0A417D27EA35FAAA1967A5AB6F8022292A77194305C71C"
          mkdir -p "$HOME/ohos-sdk"
          unzip -q ohos_cli.zip -d "$HOME/ohos-sdk"

      - name: Set up SDK environment
        run: |
          SDK_MANAGER=$(find "$HOME/ohos-sdk" -name "sdkmanager" -type f | head -1)
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$HOME/ohos-sdk" -name "sdkmanager.sh" -type f | head -1)
          fi
          if [ -n "$SDK_MANAGER" ]; then
            chmod +x "$SDK_MANAGER"
            echo "DEVECO_SDK_HOME=$HOME/ohos-sdk" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build HAR
        run: npx @ohos/hvigor assembleHar --mode module -p module=library -p buildMode=debug

      - name: Build HAP
        run: npx @ohos/hvigor assembleHap --mode module -p module=entry -p buildMode=debug

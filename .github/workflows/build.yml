name: Build

on:
  push:
    branches: [ nightly ]
    paths-ignore: [ docs/** ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: peercat/hos-compile-env-linux-amd64:latest

    steps:
      - name: Clone repository
        run: |
          git clone https://github.com/Ericple/arkffi.git /workspace
          cd /workspace
          git checkout "${{ github.ref_name }}"

      - name: Build HAR
        run: |
          cd /workspace
          hvigorw assembleHar --mode module -p module=library -p buildMode=debug

      - name: Build HAP
        run: |
          cd /workspace
          hvigorw assembleHap --mode module -p module=entry -p buildMode=debug

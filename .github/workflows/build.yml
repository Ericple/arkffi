name: Build

on:
  push:
    branches: [nightly]
    paths-ignore: [docs/**]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get HarmonyOS CLI download URL
        id: get_url
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://svc-drcn.developer.huawei.com/svc/community/common/v1/delegate" \
            -H "Content-Type: application/json" \
            -d '{"svc":"PartnerCommunityService/v1/developer/downloadCenter/getToolVersionDownloadUrl","reqType":1,"reqJson":"{\"sdkId\":\"bd3d76780d0a49de8dd117a6264fc38f\",\"versionId\":\"231781243327867001\",\"packageId\":\"231781243327873004\"}"}')

          URL=$(echo "$RESPONSE" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.loads(d["resJson"])["adUrl"])')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download and extract CLI
        run: |
          URL="${{ steps.get_url.outputs.url }}"
          curl -L -o ohos_cli.zip "$URL"
          mkdir -p "$HOME/ohos-sdk"
          unzip -q ohos_cli.zip -d "$HOME/ohos-sdk"

      - name: Set up SDK environment
        run: |
          SDK_MANAGER=$(find "$HOME/ohos-sdk" -name "sdkmanager" -type f | head -1)
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$HOME/ohos-sdk" -name "sdkmanager.sh" -type f | head -1)
          fi
          if [ -n "$SDK_MANAGER" ]; then
            chmod +x "$SDK_MANAGER"
            echo "DEVECO_SDK_HOME=$HOME/ohos-sdk" >> "$GITHUB_ENV"
          fi
          echo "SDK_MANAGER=$SDK_MANAGER"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build HAR
        run: npx @ohos/hvigor assembleHar --mode module -p module=library -p buildMode=debug

      - name: Build HAP
        run: npx @ohos/hvigor assembleHap --mode module -p module=entry -p buildMode=debug

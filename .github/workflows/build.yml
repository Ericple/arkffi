name: Build

on:
  push:
    branches: [nightly]
    paths-ignore: [docs/**]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: peercat/hos-compile-env-linux-amd64

    steps:
      - name: Clone repository
        run: |
          git clone https://github.com/Ericple/arkffi.git /workspace
          cd /workspace
          git checkout "${{ github.ref_name }}"

      - name: Locate SDK
        run: |
          # Debug: find SDK components
          echo "=== Looking for SDK ==="
          find / -maxdepth 5 -name "ets" -type d 2>/dev/null | head -5
          find / -maxdepth 5 -name "sdkmanager" -type f 2>/dev/null | head -5
          find / -maxdepth 5 -name "native" -type d 2>/dev/null | head -5
          echo "=== which hvigorw ==="
          which hvigorw 2>/dev/null || echo "not found"
          echo "=== env ==="
          env | grep -i sdk
          env | grep -i OHOS
          env | grep -i DEVECO

      - name: Build HAR
        run: |
          cd /workspace
          hvigorw assembleHar --mode module -p module=library -p buildMode=debug

      - name: Build HAP
        run: |
          cd /workspace
          hvigorw assembleHap --mode module -p module=entry -p buildMode=debug
